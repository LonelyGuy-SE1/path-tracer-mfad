<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MFAD Render Comparison</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121316;
      color: #e1e4ea;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 24px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: #8b949e;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .comparison-container {
      position: relative;
      width: 800px;
      max-width: 95vw;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      user-select: none;
      border: 1px solid #30363d;
    }
    .comparison-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .img-overlay {
      clip-path: inset(0 50% 0 0);
    }
    .slider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      background: #58a6ff;
      cursor: ew-resize;
      z-index: 10;
      transform: translateX(-50%);
    }
    .slider-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
      background: #58a6ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      color: #0d1117;
      font-weight: bold;
      font-size: 14px;
    }
    .labels {
      display: flex;
      justify-content: space-between;
      width: 800px;
      max-width: 95vw;
      margin-top: 12px;
      font-weight: 600;
      font-size: 14px;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 4px;
      background: #21262d;
      border: 1px solid #30363d;
    }
  </style>
</head>
<body>
  <h1>MFAD Render Comparison</h1>
  <div class="subtitle">Drag the slider horizontally to compare Direct Illumination vs Monte Carlo Path Tracing</div>

  <div class="comparison-container" id="container">
    <img src="final_demo_pathtraced.png" class="comparison-img" alt="After (Path Tracing)" />
    <img src="final_demo_direct.png" class="comparison-img img-overlay" id="overlay" alt="Before (Direct Lighting)" />
    <div class="slider" id="slider">
      <div class="slider-handle">↔</div>
    </div>
  </div>

  <div class="labels">
    <span class="badge" style="color: #79c0ff;">← Direct Lighting (Whitted)</span>
    <span class="badge" style="color: #56d364;">Path Tracing (Global Illumination) →</span>
  </div>

  <script>
    const container = document.getElementById('container');
    const overlay = document.getElementById('overlay');
    const slider = document.getElementById('slider');
    let isDragging = false;

    function setSliderPos(x) {
      const rect = container.getBoundingClientRect();
      let pos = (x - rect.left) / rect.width;
      pos = Math.max(0, Math.min(1, pos));
      const pct = (pos * 100).toFixed(2);
      overlay.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
      slider.style.left = `${pct}%`;
    }

    container.addEventListener('mousedown', (e) => { isDragging = true; setSliderPos(e.clientX); });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', (e) => { if (isDragging) setSliderPos(e.clientX); });

    container.addEventListener('touchstart', (e) => { isDragging = true; setSliderPos(e.touches[0].clientX); });
    window.addEventListener('touchend', () => { isDragging = false; });
    window.addEventListener('touchmove', (e) => { if (isDragging) setSliderPos(e.touches[0].clientX); });
  </script>
</body>
</html>
